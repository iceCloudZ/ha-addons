name: "FRP Relay"
version: "0.2.0"
image: ghcr.io/icecloudz/frp-relay
slug: "frp_relay"
description: "自建 frpc 客户端——经自有公网服务器(frp)中转 Home Assistant，配置走插件选项"
arch:
  - amd64
startup: services
boot: auto
init: false
map:
  - share:rw
options:
  server_addr: ""
  server_port: 7000
  token: ""
  remote_port: 7512
schema:
  server_addr: str
  server_port: port
  token: password
  remote_port: port
